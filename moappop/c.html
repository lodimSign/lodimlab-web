<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Moappop — 내 컬렉션</title>

<style>
:root{--night:#143695;--cream:#f2ede8;--lilac:#e6daef;--pink:#fa648b;
--ink:#2b2340;--sub:#8a8399;--woodLight:#7a5a3a;--line:#e3d9d2}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
-webkit-text-size-adjust:100%}
main{max-width:440px;margin:0 auto;padding:24px 18px 40px}
.brand{color:var(--cream);text-align:center;font-size:19px;font-weight:800;letter-spacing:.4px;margin-bottom:18px}
.card{background:var(--cream);border-radius:22px;padding:22px 18px;margin-bottom:14px}
.hero{text-align:center}
.hero .label{color:var(--sub);font-size:14px;margin:0 0 6px}
.hero .big{color:var(--pink);font-size:38px;font-weight:900;margin:0;letter-spacing:-1px;line-height:1.1}
.hero .lead{margin:8px 0 0;font-size:16px;font-weight:700}
.stats{display:flex;gap:8px}
.stat{flex:1;background:var(--lilac);border-radius:16px;padding:14px 8px;text-align:center}
.stat .icon{font-size:20px}
.stat .k{display:block;color:var(--sub);font-size:11px;margin:5px 0 3px;white-space:nowrap}
.stat .v{display:block;font-size:15px;font-weight:800}
.shelfTitle{font-size:15px;font-weight:800;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.toy{background:#fff;border:1px solid var(--line);border-bottom:5px solid var(--woodLight);
border-radius:14px;padding:10px 6px 8px;text-align:center}
.toy img{width:56px;height:56px;object-fit:contain;display:block;margin:0 auto}
.toy .emoji{font-size:38px;line-height:56px;height:56px}
.toy .n{font-size:12px;font-weight:700;margin:6px 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toy .p{font-size:11px;color:var(--sub)}
.more{margin:12px 0 0;text-align:center;color:var(--sub);font-size:13px}
.intro{text-align:center;font-size:15px;line-height:1.7;margin:0}
.cta{display:block;background:var(--pink);color:#fff;text-align:center;text-decoration:none;
font-size:17px;font-weight:800;padding:17px;border-radius:18px;margin-top:18px}
.note{color:#aab3d8;font-size:12px;line-height:1.7;text-align:center;margin:14px 4px 0}

body{background:linear-gradient(140deg,#fce2f1,#d9efff,#e9dffd);min-height:100vh}
.brand{color:#57416f}.card{background:#fff9f2e8;border:2px solid white;box-shadow:0 8px 30px #a483b722;border-radius:28px}
.cta,button{background:linear-gradient(#ffd7e9,#efa5d0);color:#513d66;border:2px solid white;box-shadow:0 4px 12px #b798c633;border-radius:24px;font-weight:800;padding:14px;cursor:pointer}
.note{color:#786489}.toy{border-bottom-color:#d8b8e6}.machine{position:relative;width:270px;height:405px;margin:auto}.machine>img{width:100%;height:100%}.capsule{position:absolute;width:32px;height:32px;border:2px solid #fff;border-radius:50%;background:linear-gradient(#ffdaeccc 50%,#93d5ed 51%);box-shadow:inset 3px 3px 4px white,0 2px 4px #947ab244}.machine-title{text-align:center;color:#57416f}button{display:block;width:100%;margin-top:16px;font-size:15px}
</style>
</head>
<body>
<main>
  <div class="brand">🧸 Moappop</div>
  <section class="card hero" id="hero"></section>
  <section class="card stats" id="stats" hidden></section>
  <section class="card" id="shelf" hidden></section>
  <a class="cta" id="cta" href="https://apps.apple.com/app/id6808238800"></a>
  <p class="note" id="note"></p>
</main>
<script>
(function () {
  'use strict';
  var T = {
    ko: { label: '지금까지', lead: '참았어요', items: '소장품', space: '캐리어 몇 개분', real: '실제 공간',
          shelf: '이 사람의 컬렉션', more: '그리고 {n}개 더', cta: '내 컬렉션 만들기', count: '{n}개',
          intro: '사고 싶은 건 뽑기로, 돈은 그대로.<br>가지고 싶은 걸 자판기에 넣고 뽑으면서 참는 앱이에요.',
          note: '이 컬렉션 링크는 공유 당시 요약입니다. 개인 사진 원본은 포함하지 않습니다.' },
    en: { label: 'So far', lead: 'saved', items: 'Items', space: 'Carry-ons', real: 'Real space',
          shelf: 'Their collection', more: 'and {n} more', cta: 'Make my own collection', count: '{n}',
          intro: 'Wishlist gacha. Keep your cash.<br>Put what you want into a capsule machine and pull instead of buying.',
          note: 'This collection link is a shared snapshot. Private original photos are not included.' }
  };
  var EMOJI = { keyring: '🔑', figure: '🧸', plush: '🐻', other: '📦' };
  var CATS = ['keyring', 'figure', 'plush', 'other']; // lib/model.js 의 CATEGORIES 와 같은 순서
  // 그림 키는 앱이 같이 들고 다니는 기본 아이템 6종뿐이다. 주소에서 온 값으로 src 를 만들면
  // 아무 경로나 불러오게 되므로 이 목록에 있는 것만 그린다.
  var ART = ['bunny', 'bear', 'duck', 'ghost', 'pig', 'whale'];
  var CARRY_ON_M3 = 0.055; // lib/model.js 와 같은 값

  // 주소 '#' 뒤는 base64url 로 줄인 배열이다 (만드는 쪽은 lib/model.js 의 shareLink).
  // [버전, 말(0=ko), 참은금액, 개수, cm³, [[이름, 가격, 카테고리번호, 그림?], …]]
  function read() {
    var raw = location.hash.slice(1);
    if (!raw) return null;
    try {
      raw = decodeURIComponent(raw).replace(/-/g, '+').replace(/_/g, '/');
      var bin = atob(raw + '==='.slice((raw.length + 3) % 4)); // 보낼 때 뗀 패딩을 다시 붙인다
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var d = JSON.parse(new TextDecoder().decode(bytes));
      if (!Array.isArray(d) || d[0] !== 2) return null;
      return {
        l: d[1] === 1 ? 'en' : 'ko',
        s: Number(d[2]) || 0,
        c: Number(d[3]) || 0,
        m: (Number(d[4]) || 0) / 1e6,
        i: Array.isArray(d[5]) ? d[5] : []
      };
    } catch (e) { return null; }
  }

  if(new URLSearchParams(location.search).has('machine'))return;
  var data = read();
  var t = T[data && data.l === 'en' ? 'en' : 'ko'];
  var money = function (n) { return '₩' + Math.round(n).toLocaleString('ko-KR'); };
  var fill = function (s, n) { return s.replace('{n}', n); };
  var el = function (tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text; // 주소에서 온 이름·가격은 반드시 텍스트로만 넣는다
    return e;
  };

  document.getElementById('cta').textContent = t.cta;
  document.getElementById('note').textContent = t.note;
  document.documentElement.lang = data && data.l === 'en' ? 'en' : 'ko';
  var hero = document.getElementById('hero');

  if (!data) { // 주소에 컬렉션이 없으면 앱 소개만 보여준다
    var p = el('p', 'intro');
    p.innerHTML = t.intro; // 사전에 있는 우리 문구뿐 — 바깥에서 온 값이 아니다
    hero.appendChild(p);
    return;
  }

  hero.appendChild(el('p', 'label', t.label));
  hero.appendChild(el('p', 'big', money(data.s)));
  hero.appendChild(el('p', 'lead', t.lead));

  var stats = document.getElementById('stats');
  [['🧸', t.items, fill(t.count, data.c)],
   ['🧳', t.space, fill(t.count, (data.m / CARRY_ON_M3).toFixed(1))],
   ['🏠', t.real, '0cm²']
  ].forEach(function (row) {
    var box = el('div', 'stat');
    box.appendChild(el('div', 'icon', row[0]));
    box.appendChild(el('span', 'k', row[1]));
    box.appendChild(el('span', 'v', row[2]));
    stats.appendChild(box);
  });
  stats.hidden = false;

  if (data.i.length) {
    var shelf = document.getElementById('shelf');
    shelf.appendChild(el('p', 'shelfTitle', t.shelf));
    var grid = el('div', 'grid');
    data.i.forEach(function (x) {
      if (!Array.isArray(x)) return;
      var toy = el('div', 'toy');
      if (ART.indexOf(x[3]) >= 0) {
        var img = new Image();
        img.src = 'items/' + x[3] + '.png';
        img.alt = '';
        toy.appendChild(img);
      } else {
        toy.appendChild(el('div', 'emoji', EMOJI[CATS[x[2]]] || EMOJI.other));
      }
      toy.appendChild(el('div', 'n', String(x[0] == null ? '' : x[0]).slice(0, 20)));
      toy.appendChild(el('div', 'p', money(Number(x[1]) || 0)));
      grid.appendChild(toy);
    });
    shelf.appendChild(grid);
    if (data.c > data.i.length) shelf.appendChild(el('p', 'more', fill(t.more, data.c - data.i.length)));
    shelf.hidden = false;
  }
})();
</script>

const make=(tag,cls,text)=>{const e=document.createElement(tag);e.className=cls||'';if(text!=null)e.textContent=text;return e;};
const money=n=>'₩'+Number(n||0).toLocaleString('ko-KR');
cta.textContent='앱에서 방문 뽑기 · 2코인';cta.href='moappop://visit?machine='+encodeURIComponent(id);
note.textContent='상품 이름·가격과 주인이 공개한 사진을 보여줍니다. 뽑기는 앱에서 로그인 후 진행하며, 본인 기계는 1코인입니다.';
const install=make('a','cta','Moappop 설치하기');install.href='https://apps.apple.com/app/id6808238800';cta.after(install);
async function load(full=false){
 hero.textContent='기계를 불러오고 있어요…';
 try{
 if(!/^[0-9a-f-]{36}$/i.test(id))throw Error('invalid');
 const response=await fetch(api+'/rest/v1/rpc/moappop_public',{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({p_machine_id:id,p_full:full})});
 if(!response.ok)throw Error('network');const data=await response.json();
 if(!data){hero.textContent='공개가 중지됐거나 찾을 수 없는 기계예요.';shelf.hidden=true;cta.hidden=true;return;}
 hero.replaceChildren(make('h1','machine-title',names[data.skin]||names.star));
 const machine=make('div','machine'),image=new Image();image.src=skins[data.skin]||skins.star;image.alt=names[data.skin]||names.star;machine.append(image);
 for(let i=0;i<Math.min(data.count,12);i++){const cap=make('div','capsule');cap.style.left=(63+(i%4)*35)+'px';cap.style.top=(170-Math.floor(i/4)*29)+'px';machine.append(cap);}hero.append(machine,make('p','lead',data.count+'개 남았어요'),make('p','big',money(data.savedTotal)),make('p','label','지금까지 참은 금액'));
 cta.hidden=data.count===0;if(!data.count)hero.append(make('p','lead','지금은 품절이에요.'));
 shelf.replaceChildren(make('h2','shelfTitle',full?'전체 상품':'대표 상품'));shelf.hidden=false;const grid=make('div','grid');shelf.append(grid);
 for(const item of data.items){const card=make('div','toy');const placeholder=make('div','emoji','◉');card.append(placeholder,make('div','n',item.name),make('div','p',money(item.price)));grid.append(card);
 if(item.publicPhoto&&/^[0-9a-f-]{36}\/[0-9a-f-]{36}\.png$/i.test(item.publicPhoto)){
 fetch(api+'/storage/v1/object/sign/public-items/'+item.publicPhoto,{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({expiresIn:3600})}).then(r=>r.ok?r.json():null).then(d=>{if(d?.signedURL){const img=new Image();img.alt='공개 상품 사진';img.onload=()=>placeholder.replaceWith(img);img.src=api+'/storage/v1'+d.signedURL;}}).catch(()=>{});
 }else if(['bunny','bear','duck','ghost','pig','whale'].includes(item.art)){const img=new Image();img.alt='';img.src='items/'+item.art+'.png';placeholder.replaceWith(img);}}

 }catch{hero.textContent='기계를 불러오지 못했어요. 잠시 후 다시 시도해주세요.';const retry=make('button','','다시 시도');retry.onclick=()=>load(full);hero.append(retry);cta.hidden=true;}
